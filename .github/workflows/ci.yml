name: CI & Multi-Platform Packaging

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Automatically strips leading 'v' from tag names (e.g., v0.1.0 -> 0.1.0), defaulting to 0.1.0 on branch builds
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && substring(github.ref_name, 1, 99) || '0.1.0' }}

jobs:
  test:
    name: Unit, Corpus & Offscreen Render Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run all tests (Core, Model, Swing & Compose UI Renders)
        run: ./gradlew test --no-daemon

      - name: Upload Swing & Compose offscreen render snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-render-snapshots
          path: |
            diff-ui-swing/build/reports/sample-renders/*.png
            diff-ui-compose/build/reports/compose-renders/*.png

  package-linux:
    name: Package Linux (DEB, AppImage Tarball, Fat-JAR)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install jpackage DEB dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev binutils

      - name: Build Fat-JAR and CLI distributions
        run: ./gradlew :app:stageJpackageInput :app:distTar :app:distZip -PreleaseVersion="${APP_VERSION}" --no-daemon

      - name: Build Linux .deb installer and self-contained app-image via jpackage
        run: |
          mkdir -p dist-packages
          cp app/build/jpackage-input/ijdiff-standalone.jar "dist-packages/ijdiff-${APP_VERSION}-linux-x64.jar"
          cp app/build/distributions/ijdiff-*.tar "dist-packages/ijdiff-${APP_VERSION}-cli-dist.tar"
          cp app/build/distributions/ijdiff-*.zip "dist-packages/ijdiff-${APP_VERSION}-cli-dist.zip"

          # 1. Self-contained Linux app-image (with bundled JRE)
          jpackage \
            --type app-image \
            --name ijdiff \
            --app-version "${APP_VERSION}" \
            --vendor "ijdiff" \
            --description "Standalone IntelliJ Diff and Directory Comparison Viewer" \
            --input app/build/jpackage-input \
            --main-jar ijdiff-standalone.jar \
            --main-class org.ijdiff.app.MainKt \
            --dest build/jpackage-linux-image

          tar -czf "dist-packages/ijdiff-${APP_VERSION}-linux-x64-portable.tar.gz" -C build/jpackage-linux-image ijdiff

          # 2. Native Debian/Ubuntu .deb package
          jpackage \
            --type deb \
            --name ijdiff \
            --app-version "${APP_VERSION}" \
            --vendor "ijdiff" \
            --description "Standalone IntelliJ Diff and Directory Comparison Viewer" \
            --linux-shortcut \
            --linux-menu-group "Development" \
            --input app/build/jpackage-input \
            --main-jar ijdiff-standalone.jar \
            --main-class org.ijdiff.app.MainKt \
            --dest dist-packages

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ijdiff-linux-x64-packages
          path: dist-packages/*

  package-macos:
    name: Package macOS (DMG, PKG, Fat-JAR)
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Fat-JAR for macOS
        run: ./gradlew :app:stageJpackageInput -PreleaseVersion="${APP_VERSION}" --no-daemon

      - name: Build macOS .dmg and .pkg installers via jpackage
        run: |
          mkdir -p dist-packages
          cp app/build/jpackage-input/ijdiff-standalone.jar "dist-packages/ijdiff-${APP_VERSION}-macos-arm64.jar"

          # Apple CFBundleVersion requires the first integer in jpackage --app-version to be >= 1
          if [[ "${APP_VERSION}" == 0.* ]]; then
            MACOS_JPACKAGE_VERSION="1.${APP_VERSION#0.}"
          else
            MACOS_JPACKAGE_VERSION="${APP_VERSION}"
          fi

          # 1. Native macOS .dmg installer (bundles ijdiff.app + modular JRE)
          jpackage \
            --type dmg \
            --name "ijdiff" \
            --app-version "${MACOS_JPACKAGE_VERSION}" \
            --vendor "ijdiff" \
            --description "Standalone IntelliJ Diff and Directory Comparison Viewer" \
            --input app/build/jpackage-input \
            --main-jar ijdiff-standalone.jar \
            --main-class org.ijdiff.app.MainKt \
            --java-options "-Dapple.laf.useScreenMenuBar=true" \
            --java-options "-Dapple.awt.application.name=ijdiff" \
            --java-options "-Dapple.awt.application.appearance=system" \
            --dest build/jpackage-macos-dmg

          mv build/jpackage-macos-dmg/ijdiff-*.dmg "dist-packages/ijdiff-${APP_VERSION}-macos-arm64.dmg"

          # 2. Native macOS .pkg installer
          jpackage \
            --type pkg \
            --name "ijdiff" \
            --app-version "${MACOS_JPACKAGE_VERSION}" \
            --vendor "ijdiff" \
            --description "Standalone IntelliJ Diff and Directory Comparison Viewer" \
            --input app/build/jpackage-input \
            --main-jar ijdiff-standalone.jar \
            --main-class org.ijdiff.app.MainKt \
            --java-options "-Dapple.laf.useScreenMenuBar=true" \
            --java-options "-Dapple.awt.application.name=ijdiff" \
            --java-options "-Dapple.awt.application.appearance=system" \
            --dest build/jpackage-macos-pkg

          mv build/jpackage-macos-pkg/ijdiff-*.pkg "dist-packages/ijdiff-${APP_VERSION}-macos-arm64.pkg"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: ijdiff-macos-arm64-packages
          path: dist-packages/*

  package-windows:
    name: Package Windows (MSI, Portable Zip, Fat-JAR)
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Fat-JAR for Windows
        run: ./gradlew.bat :app:stageJpackageInput -PreleaseVersion="${APP_VERSION}" --no-daemon

      - name: Build Windows .msi installer and portable .zip via jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-packages | Out-Null
          Copy-Item "app/build/jpackage-input/ijdiff-standalone.jar" "dist-packages/ijdiff-$env:APP_VERSION-windows-x64.jar"

          # 1. Self-contained Windows app-image (with bundled JRE & ijdiff.exe)
          jpackage `
            --type app-image `
            --name "ijdiff" `
            --app-version "$env:APP_VERSION" `
            --vendor "ijdiff" `
            --description "Standalone IntelliJ Diff and Directory Comparison Viewer" `
            --input "app/build/jpackage-input" `
            --main-jar "ijdiff-standalone.jar" `
            --main-class "org.ijdiff.app.MainKt" `
            --dest "build/jpackage-win-image"

          Compress-Archive -Path "build/jpackage-win-image/ijdiff" -DestinationPath "dist-packages/ijdiff-$env:APP_VERSION-windows-x64-portable.zip"

          # 2. Native Windows .msi installer (with Start Menu shortcut & directory chooser)
          jpackage `
            --type msi `
            --name "ijdiff" `
            --app-version "$env:APP_VERSION" `
            --vendor "ijdiff" `
            --description "Standalone IntelliJ Diff and Directory Comparison Viewer" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut `
            --input "app/build/jpackage-input" `
            --main-jar "ijdiff-standalone.jar" `
            --main-class "org.ijdiff.app.MainKt" `
            --dest "build/jpackage-win-msi"

          Move-Item "build/jpackage-win-msi/ijdiff-*.msi" "dist-packages/ijdiff-$env:APP_VERSION-windows-x64.msi"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: ijdiff-windows-x64-packages
          path: dist-packages/*

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [ package-linux, package-macos, package-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: ijdiff-*-packages
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
