# ijdiff configuration file (TOML)
# Placed in ./ijdiff.toml or ~/.config/ijdiff/config.toml
# Every key corresponds 1-to-1 with a CLI option.

# Desktop UI toolkit: "swing" (Phase 1) or "compose" (Phase 2 Compose Multiplatform) (CLI: --ui)
ui = "swing"
theme = "dark"
unified = false
whitespace = "default"

[font]
# Editor font family (CLI: --font-family)
family = "JetBrains Mono"

# Editor font size in pt, 8..48 (CLI: --font-size)
size = 13

[ui.font]
# UI chrome font family for toolbars, tabs, tables, and dialogs (CLI: --ui-font-family)
# family = "Inter"

# UI chrome font size in pt, 8..48 (CLI: --ui-font-size)
size = 13
