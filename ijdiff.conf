# ijdiff configuration file
# Placed in ./ijdiff.conf or ~/.config/ijdiff/ijdiff.conf

# Editor font face / family (also accepts `font.face` or `editor.font.family`)
font.family = JetBrains Mono

# Editor font size in pt (8..48, also accepts `editor.font.size`)
font.size = 13

# UI theme: dark (Darcula) or light (IntelliJ Light)
theme = dark
